[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-neuro-symbolic"
version = "0.1.0"
description = "A neuro-symbolic trading system for XAUUSD"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "tensorflow",
    "streamlit",
    "crewai",
    "langchain",
    "pyyaml",
    "pandas-ta",
    "yfinance",
    "oandapy",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "notebook",
]